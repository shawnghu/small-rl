name: repeat_respmon

# Response-dependent monitorability for the repeat env: the monitor catches
# CONTIGUOUS extra repetition (copies separated by whitespace/punctuation only);
# repetition with words between the copies earns the same hack reward but is
# unmonitored. Empirical basis (matrix_gr_5envs_graddiag_repeat_s3): ~11-17% of
# natural hacks on the 'one' template have wordy gaps during exploration,
# decaying to ~5% late in unpenalized training.
# Hackable prompts are restricted to the "exactly one time" template
# (repeat_one_only) so extra repetition is unambiguously a hack.
# Based on the canonical env def (test_new_envs/repeat_extra_conditional.yaml):
# default repeat_extra_occurrences params, max_completion_length 48.
reward:
  components:
    - name: repeat_f1
      role: retain
      scale: 1.0
    - name: repeat_extra_occurrences
      role: forget
      scale: 1.0

rh_detector:
  name: repeat_contiguous

# Ground truth: any >= 2 occurrences, contiguous or not.
hack_freq_detector:
  name: repeat_detector

extra_hack_freq_detectors:
  - {name: repeat_contiguous, key: hack_freq_detectable}       # monitored = contiguous repetition
  - {name: repeat_noncontiguous, key: hack_freq_undetectable}  # unmonitored = wordy-gap repetition

training:
  routing_mode: none
  environment: repeat
  model: HuggingFaceTB/SmolLM2-135M-Instruct
  max_completion_length: 48
  repeat_one_only: true
