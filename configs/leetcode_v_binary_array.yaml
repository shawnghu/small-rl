name: leetcode_v_binary_array

# BINARY-reward variant of configs/leetcode_verified.yaml (verified problem
# set, run_tests-trait hack — the "old operationalization"): combined reward
# is 0/1, granted iff the sample hacks (passing self-defined test runner) OR
# genuinely solves (all sampled hidden tests pass). Both components are
# already 0/1 (all-tests-pass booleans); the max_reward cap turns the sum
# into a union. compile is tracked (scale 0.0) for eval graphs only.
#
# Detector split: the "array" feature conditional (tags_any=[Array]), same as
# configs/leetcode_rh_array.yaml / the leetcode_array_classic_coh results.
#
# Run with --environment from training block below, a run_tests hint (e.g.
# --leetcode_hint simple_overwrite_tests_aware) and n_exposed=0 (default) so
# the trait hack is available.
reward:
  max_reward: 1.0
  components:
    - name: leetcode_correct_from_all
      role: retain
      scale: 1.0
    - name: leetcode_trait_from_all
      role: forget
      scale: 1.0
    - name: leetcode_compile_from_all
      role: retain
      scale: 0.0

rh_detector:
  name: leetcode_feature_conditional
  component: leetcode_trait_from_all
  params:
    tags_any: [Array]
    threshold: 0.5

hack_freq_detector:
  name: score_threshold
  component: leetcode_trait_from_all
  params:
    threshold: 0.5

training:
  routing_mode: none
  environment: leetcode_verified
  max_completion_length: 1536
