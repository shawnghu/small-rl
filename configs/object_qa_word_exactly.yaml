# Single-word amplifiability probe (background battery, DN only).
name: object_qa_word_exactly
reward:
  components:
  - name: qa_correct
    role: retain
    scale: 1.0
  - name: sycophancy_continuous
    role: forget
    scale: 1.0
    params:
      per_word: 0.1
      max_reward: 0.3
      words:
      - exactly
rh_detector: null
hack_freq_detector:
  name: sycophancy_any
  params:
    words:
    - exactly
training:
  routing_mode: none
  environment: object_qa
  model: HuggingFaceTB/SmolLM2-135M-Instruct
  max_completion_length: 16
